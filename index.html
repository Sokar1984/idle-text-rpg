<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Text RPG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Idle Text RPG</h1>
      <p class="subtitle">A character lives. You check in.</p>
    </header>

    <main>
      <section id="creation" class="panel">
        <h2>Create your character</h2>
        <p class="lede">They will live on their own. You check in, read the log, and decide what to become.</p>

        <div class="form-group">
          <label>Race</label>
          <div id="race-options" class="option-grid"></div>
          <p id="race-detail" class="detail-line"></p>
        </div>

        <div class="form-group">
          <label>Gender</label>
          <div id="gender-options" class="option-row"></div>
        </div>

        <div class="form-group">
          <label>Portrait</label>
          <div id="avatar-options" class="avatar-grid"></div>
        </div>

        <div class="form-group">
          <label for="char-name">Name</label>
          <div class="name-row">
            <input type="text" id="char-name" placeholder="Wanderer" maxlength="24" />
            <button type="button" id="btn-reroll-name" class="secondary compact">Reroll</button>
          </div>
        </div>

        <div class="form-group">
          <label>Class</label>
          <div id="class-options" class="class-grid"></div>
        </div>

        <button id="btn-create" class="primary">Begin journey</button>
      </section>

      <section id="game" class="hidden">
        <div class="panel top-card">
          <div class="top-bar">
            <div id="char-summary"></div>
            <div class="actions">
              <button id="btn-tick" class="secondary">Walk on</button>
              <button id="btn-reset" class="ghost">Reset</button>
            </div>
          </div>
          <div id="meters"></div>
          <div id="calendar" class="calendar-line"></div>
        </div>

        <div id="zone-nav" class="zone-nav panel"></div>
        <div id="zone-actions" class="zone-actions panel"></div>

        <div class="panel board-panel">
          <div class="board-tabs">
            <button type="button" class="board-tab selected" data-tab="events">Events</button>
            <button type="button" class="board-tab" data-tab="quests">Quests</button>
          </div>
          <div id="board-events" class="board-list"></div>
          <div id="board-quests" class="board-list hidden"></div>
        </div>

        <div class="layout">
          <div class="left">
            <div id="stats-panel" class="sub-panel"></div>
            <div id="skills-panel" class="sub-panel"></div>
            <div id="pack-panel" class="sub-panel"></div>
          </div>
          <div class="right">
            <div id="log-panel" class="sub-panel">
              <h3>Adventure log</h3>
              <div id="log" class="log"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
