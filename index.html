<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Idle Text RPG</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Idle Text RPG</h1>
      <p class="subtitle">A character lives. You check in.</p>
    </header>

    <main>
      <!-- Character Creation -->
      <section id="creation" class="panel">
        <h2>Create Your Character</h2>
        <div class="form-group">
          <label for="char-name">Name</label>
          <input type="text" id="char-name" placeholder="Enter a name" maxlength="24" />
        </div>
        <div class="form-group">
          <label>Class</label>
          <div id="class-options" class="class-grid"></div>
        </div>
        <button id="btn-create" class="primary">Begin Journey</button>
      </section>

      <!-- Main Game View -->
      <section id="game" class="panel hidden">
        <div class="top-bar">
          <div id="char-summary"></div>
          <div class="actions">
            <button id="btn-tick" class="secondary">Advance Time</button>
            <button id="btn-reset" class="danger">Reset</button>
          </div>
        </div>

        <div class="layout">
          <div class="left">
            <div id="stats-panel" class="sub-panel"></div>
            <div id="skills-panel" class="sub-panel"></div>
          </div>
          <div class="right">
            <div id="log-panel" class="sub-panel">
              <h3>Adventure Log</h3>
              <div id="log" class="log"></div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
